# @package _global_
#
# Standalone cache config for InternVL hidden-state caching.
# Cannot use default_training as a base because default_training has its own
# hydra.searchpath which conflicts with Hydra's "only primary config" rule.
#
# Usage:
#   torchrun --nnodes=1 --nproc_per_node=8 \
#       navsim/planning/script/run_dataset_caching_internvl.py \
#       --config-name cache_internvl \
#       agent.checkpoint_path=/path/to/checkpoint \
#       cache_path=/path/to/cache_output

hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: internvl_agent
  - _self_

split: trainval
cache_path: ${oc.env:NAVSIM_EXP_ROOT}/internvl_cache/vlm_hidden_state
use_cache_without_dataset: false
force_cache_computation: true

experiment_name: internvl_cache

# Agent cache settings (merged with agent YAML via _self_)
agent:
  cache_mode: true
  cache_hidden_state: true
