hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common 
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  # Agent yaml interpolates trainer.params / dataloader.params (e.g. scheduler_args).
  - ddp
  - agent: chainflow_vla_pad_ar_bicycle_pro
  - _self_
  - override train_test_split: navtest

"team_name": WorldModel # The team name
"authors": AFARI # The team members
"email": xiyangwang2050@gmail.com # email of the corresponding team member
"institution": AFARI # affiliation of the team
"country": China # country or region of the team, e.g. China
seed: 0
deterministic: false
